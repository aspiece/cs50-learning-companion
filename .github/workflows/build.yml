name: Build and release CS50 Learning Companion

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check version and release tag
        run: npm run verify:release
      - name: Run automated tests
        run: npm test
      - name: Build VSIX using the official VS Code packager
        run: npm run package
      - name: Verify VSIX content and filename
        shell: bash
        run: |
          set -euo pipefail
          CHECK_VSIX=1 npm run verify:release
          VERSION=$(node -p "require('./package.json').version")
          VSIX="cs50-learning-companion-${VERSION}.vsix"
          unzip -t "$VSIX" > /dev/null
          unzip -Z1 "$VSIX" | grep -qx 'extension/package.json'
          unzip -Z1 "$VSIX" | grep -qx 'extension/src/extension.js'
          unzip -Z1 "$VSIX" | grep -qx 'extension/content/cs50p-starters.js'
          sha256sum "$VSIX" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload reproducible build
        uses: actions/upload-artifact@v5
        with:
          name: cs50-learning-companion-vsix
          path: |
            *.vsix
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated build
        uses: actions/download-artifact@v5
        with:
          name: cs50-learning-companion-vsix
      - name: Verify release checksum
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish versioned GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.vsix SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CS50 Learning Companion $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
