name: Build VS Code extension

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build VSIX using the official VS Code packager
        run: npm run package
      - name: Verify the installable package structure
        shell: bash
        run: |
          set -euo pipefail
          VSIX=$(find . -maxdepth 1 -name '*.vsix' -print -quit)
          test -n "$VSIX" || { echo "::error::No VSIX produced"; exit 1; }
          unzip -t "$VSIX" > /dev/null
          unzip -Z1 "$VSIX" | grep -qx 'extension/package.json'
          unzip -Z1 "$VSIX" | grep -qx 'extension/src/extension.js'
          unzip -Z1 "$VSIX" | grep -qx 'extension/content/cs50p-starters.js'
          echo "Validated installable file: $VSIX"
          ls -lh "$VSIX"
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs50-learning-companion-vsix
          path: '*.vsix'
          if-no-files-found: error
