name: Build and release CS50 Learning Companion

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check version and release tag
        run: npm run verify:release
      - name: Validate classroom installation scripts
        run: bash -n scripts/install-in-codespaces.sh scripts/update-in-codespaces.sh
      - name: Run automated tests
        run: npm test
      - name: Build VSIX using the official VS Code packager
        run: npm run package
      - name: Verify VSIX content and filename
        shell: bash
        run: |
          set -euo pipefail
          CHECK_VSIX=1 npm run verify:release
          VERSION=$(node -p "require('./package.json').version")
          VSIX="cs50-learning-companion-${VERSION}.vsix"
          unzip -t "$VSIX" > /dev/null
          unzip -Z1 "$VSIX" | grep -qx 'extension/package.json'
          unzip -Z1 "$VSIX" | grep -qx 'extension/src/extension.js'
          unzip -Z1 "$VSIX" | grep -qx 'extension/content/cs50p-starters.js'
          sha256sum "$VSIX" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload reproducible build
        uses: actions/upload-artifact@v5
        with:
          name: cs50-learning-companion-vsix
          path: |
            *.vsix
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    # A new validated build becomes available to students automatically.
    # Version-tag pushes remain supported as an optional release path.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: cs50-classroom-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download tested extension package
        uses: actions/download-artifact@v5
        with:
          name: cs50-learning-companion-vsix
      - name: Publish verified versioned classroom release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          VSIX="$(find . -maxdepth 1 -type f -name 'cs50-learning-companion-*.vsix' -print -quit)"
          test -n "$VSIX"
          VERSION="${VSIX#./cs50-learning-companion-}"
          VERSION="${VERSION%.vsix}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match $TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
            if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
              echo "This build is no longer the latest main commit; a newer build will publish instead."
              exit 0
            fi
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "GCI CS50 Learning Companion $TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$VSIX" SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GCI CS50 Learning Companion $TAG" \
              --notes "Verified classroom pilot package. Check for updates using the GCI sidebar. Keep your CS50 assignment files and Learning Journals." \
              --prerelease
          fi
          echo "Published classroom update $TAG"
